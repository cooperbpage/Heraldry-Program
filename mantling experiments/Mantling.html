<script>/* Browser: Mantling.render(strokes, options). Node: require('./engine.js').
 * Coordinates are in the editor's 400 × 370 viewBox. All geometry is deterministic.
 * Each guide is a half-achievement, authored on the right; reflection is applied last.
 */
(function (root, factory) {
  const api = factory();
  if (typeof module === 'object' && module.exports) module.exports = api;
  else root.Mantling = api;
})(typeof globalThis === 'undefined' ? this : globalThis, function () {
  'use strict';
  const PI = Math.PI, TAU = 2 * PI;
  const clamp = (x, lo, hi) => Math.max(lo, Math.min(hi, x));
  const mix = (a, b, t) => a + (b - a) * t;
  const lerp = (a, b, t) => [mix(a[0], b[0], t), mix(a[1], b[1], t)];
  const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
  const fmt = n => Number(n.toFixed(2));
  const xy = p => fmt(p[0]) + ' ' + fmt(p[1]);
  const unit = (x,y) => { const d = Math.hypot(x,y) || 1; return [x/d,y/d]; };
  const move = (p,t,n,x,y) => [p[0]+t[0]*x+n[0]*y, p[1]+t[1]*x+n[1]*y];

  // Equal-distance sampling before corner cutting makes a slowly drawn line
  // behave like the same gesture drawn quickly.
  function measure(points) {
    const lengths = [0];
    for (let i = 1; i < points.length; i++) lengths.push(lengths[i-1] + dist(points[i-1], points[i]));
    const length = lengths[lengths.length-1];
    function at(s) {
      if (s <= 0 || !length) return points[0];
      if (s >= length) return points[points.length-1];
      let lo = 0, hi = points.length-1;
      while (hi-lo > 1) {
        const m = (hi+lo) >> 1;
        if (lengths[m] < s) lo = m; else hi = m;
      }
      return lerp(points[lo], points[hi], (s-lengths[lo])/(lengths[hi]-lengths[lo]));
    }
    function frame(s) {
      const p = at(s), a = at(s-1.7), b = at(s+1.7);
      const t = unit(b[0]-a[0], b[1]-a[1]);
      return {p,t,n:[-t[1],t[0]]};
    }
    return {length,at,frame};
  }

  function sample(points) {
    const clean = [];
    for (const p of points || []) {
      if (Array.isArray(p) && Number.isFinite(p[0]) && Number.isFinite(p[1]) &&
          (!clean.length || dist(p,clean[clean.length-1]) > .15)) clean.push([p[0],p[1]]);
    }
    if (clean.length < 2) return clean;
    const raw = measure(clean);
    const count = Math.max(1, Math.ceil(raw.length/9));
    let poly = Array.from({length:count+1}, (_,i)=>raw.at(i*raw.length/count));
    for (let pass = 0; pass < 3; pass++) {
      const next = [poly[0]];
      for (let i=1;i<poly.length;i++) next.push(lerp(poly[i-1],poly[i],.25),lerp(poly[i-1],poly[i],.75));
      next.push(poly[poly.length-1]); poly=next;
    }
    const smooth = measure(poly), n = Math.max(1,Math.ceil(smooth.length/2.5));
    return Array.from({length:n+1},(_,i)=>smooth.at(i*smooth.length/n));
  }

  function smoothPath(points, start=true) {
    if (!points.length) return '';
    let d = start ? 'M'+xy(points[0]) : '';
    for (let i=1;i<points.length;i++) {
      const a=points[i-1], b=points[i], prev=points[Math.max(0,i-2)], next=points[Math.min(i+1,points.length-1)];
      d += 'C'+xy([a[0]+(b[0]-prev[0])/6,a[1]+(b[1]-prev[1])/6])+' '+

    }
    return d;
  }
  function curve(a,b,fn,step=5) {
    const count=Math.max(1,Math.ceil(Math.abs(b-a)/step));
    return Array.from({length:count+1},(_,i)=>fn(mix(a,b,i/count),i/count));

  // A diminishing-radius volute joined with the exact incoming tangent.
  function volute(p,t,sign,r,angle) {
    const a=Math.atan2(t[1],t[0]), out=[p];
    const steps=Math.max(8,Math.ceil(angle*r/2));
    for(let i=0;i<steps;i++){
      const u=(i+.5)/steps, theta=a+sign*angle*u;
      const ds=r*angle/steps*Math.pow(1-u*.83,1.05);
      const last=out[out.length-1];
      out.push([last[0]+Math.cos(theta)*ds,last[1]+Math.sin(theta)*ds]);
    }
    return out;
  }

  const defaults = {method:'acanthus',fill:true,line:true,shade:false,hatch:false,rib:true,width:1,curl:.5,detail:1};
  function render(strokes, options) {
    const opt=Object.assign({},defaults,options||{});
    if (!['acanthus','cloth','scroll'].includes(opt.method)) opt.method='acanthus';
    const method=opt.method, detail=clamp(+opt.detail||1,.35,2);
    const ink='#362327', red='#ae282d', ivory='#fffdf5';
    const prefix=String(opt.idPrefix||'mantle').replace(/[^\w-]/g,'');
    let serial=0, defs='', marks='';
    const id = name => prefix + '-' + name;
    const url = k => 'url(#'+id(k)+')';
    const addDef = (tag,key,body,attrs='') => { defs+='<'+tag+' id="'+id(key)+'" '+attrs+'>'+body+'</'+tag+'>'; };
    function strokePath(d,w,color,extra='') {
      return '<path d="'+d+'" fill="none" stroke="'+color+'" stroke-width="'+fmt(w)+'" stroke-linecap="round" stroke-linejoin="round" '+extra+'/>';
    }
    if (opt.shade) {
      const gradient=(key,stops)=>addDef('linearGradient',key,stops.map(([s,c])=>'<stop offset="'+s+'%" stop-color="'+c+'"/>').join(''),'x1="0%" x2="65%" y1="0%" y2="100%"');
      gradient('silk',[[0,'#77252a'],[28,'#ae2930'],[50,'#dc4e47'],[69,'#b92c31'],[100,'#752028']]);
      gradient('lining',[[0,'#c2ada5'],[25,'#e6d9c9'],[47,'#fffdf4'],[72,'#f5efdf'],[100,'#c9b8ae']]);
      gradient('paper',[[0,'#cbcac1'],[45,'#fffef7'],[72,'#efede3'],[100,'#cac3b9']]);
    }
    function material(back) {
      if (opt.shade) return url(opt.fill ? (back?'lining':'silk') : 'paper');
      return opt.fill ? (back?ivory:red) : '#fffdf8';
    }

    function strand(points,settings) {
      if (points.length<2) return '';
      const spine=measure(points), L=spine.length, G=settings.guideLength || L;
      if (L<2) return '';
      const size=settings.size, sub=!!settings.sub;
      const flips=settings.flips || [], phase=settings.phase || 0;
      const asym= Math.sin(phase*1.37)>=0?1:-1;
      const folds=flips.map(v=>v*G).filter(x=>x>.75 && x<L-.75).sort((a,b)=>a-b);
      const limits=[0,...folds,L], memo=new Map();
      function width(s) {
        const u=s/L;
        // The root is gathered at the helm; it opens into a blade before tapering.
        let body=(.39+.65*Math.sin(Math.PI*Math.pow(clamp(u,0,1),.72))**.72);
        if (sub) body=(.19+.88*Math.sin(Math.PI*Math.pow(clamp(u,0,1),.67))**.7);

      state.strokes.push({points:g.pts,twists:len>70?[.52]:[],scale:parent?Math.max(.5,(parent.scale||1)*.76):1,curl:.55});
    }
    state.preset='custom';render();
  });
  function cancel(){active=null;drawOverlay();}
  plate.addEventListener('pointercancel',cancel);plate.addEventListener('lostpointercapture',()=>{if(active)cancel();});
  all('[data-method]').forEach(e=>e.onclick=()=>{checkpoint();state.method=e.dataset.method;render();});
  all('[data-tool]').forEach(e=>e.onclick=()=>{tool=e.dataset.tool;say(help[tool]);render();});
  all('[data-layer]').forEach(e=>e.onchange=()=>{checkpoint();state[e.dataset.layer]=e.checked;render();});
  for(const id of ['width','detail']){const e=$('#'+id);e.onchange=()=>{checkpoint();state[id]=+e.value;render();};}
  $('#guides').onchange=e=>{guides=e.target.checked;drawOverlay();};
  $('#preset').onchange=e=>{checkpoint();state.preset=e.target.value;state.strokes=clone(presets[state.preset]||[]);render();};
  $('#undo').onclick=()=>{if(before.length){after.push(clone(state));state=before.pop();render();}};
  $('#redo').onclick=()=>{if(after.length){before.push(clone(state));state=after.pop();render();}};
  $('#export').onclick=()=>{
    const svg='<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="740" viewBox="0 0 400 370">'+$('#art').innerHTML+Studies.helmet+'</svg>';
    const url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));const a=document.createElement('a');
    a.href=url;a.download='Mantling.svg';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);
  };
  render();say(help[tool]);
})();
</script></body></html>
