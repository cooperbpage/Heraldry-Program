        if(!w){w=[hit.t,0];el.width.push(w);el.width.sort((l,r)=>l[0]-r[0]);}
        w[1]=M.clamp(M.distance(a,b)/2,.15,40);M.keep(doc,el);
        selected=el.id;mark='w'+el.width.indexOf(w);
      });return;
    }
    if(!drag||ev.pointerId!==drag.id)return;const g=drag;drag=null;
    const end=point(ev);if(M.distance(end,g.pts[g.pts.length-1])>.6)g.pts.push(end);
    finish(g);overlay();
  });
  const cancel=()=>{drag=null;overlay();};plate.addEventListener('pointercancel',cancel);plate.addEventListener('lostpointercapture',cancel);
  all('[data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;mark=null;redraw=false;render();say(setToolHints[tool]);});
  $('#target').onchange=ev=>{selected=ev.target.value||null;mark=null;redraw=false;render();};
  $('#event').onchange=ev=>{mark=ev.target.value||null;render();};
  $('#presets').onchange=ev=>{const key=ev.target.value;if(presets[key])replaceDoc({...M.copy(presets[key]),preset:key});};
  $('#reset').onclick=()=>replaceDoc({mirror:true,roots:[],preset:'drawing'},'Blank sheet. Draw a sweep from the helm.');
  $('#undo').onclick=()=>{doc=history.undo(doc);mark=null;redraw=false;render();};
  $('#redo').onclick=()=>{doc=history.redo(doc);mark=null;redraw=false;render();};
  $('#reseed').onclick=()=>change(()=>{doc=M.decorate(doc,freshSeed());},'New ornaments on the same main sweeps.');
  for(const key of ['guides','generative'])$('#'+key).onchange=ev=>{settings[key]=ev.target.checked;render();if(key==='generative')say('Draw one to three sweeps on a blank sheet. Reseed recomposes their ornaments.');};
  $('#smoothing').oninput=ev=>{settings.smoothing=+ev.target.value;$('#smoothVal').textContent=Math.round(settings.smoothing*100)+'%';remember();};
  all('[data-opt]').forEach(b=>b.onchange=()=>{settings[b.dataset.opt]=b.checked;render();});
  $('#export').onclick=()=>{
    const svg='<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="740" viewBox="0 0 400 370">'+$('#art').innerHTML+$('#helm').innerHTML+'</svg>';
    const url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));const a=document.createElement('a');a.href=url;a.download='Mantling.svg';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);
  };
  render();say(setToolHints[tool]);
})();
</script></body></html>
